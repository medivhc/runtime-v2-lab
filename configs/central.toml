# central.toml — Runtime 中心配置（绝对路径以实际生成为准）
listen = "127.0.0.1:18080"
database = "/root/workspace/runtime-v2-lab/central/runtime.sqlite"
evidence_root = "/root/workspace/runtime-v2-lab/central/evidence"
operator_token_env = "RUNTIME_OPERATOR_TOKEN"
planner_node = "control"
offline_after_seconds = 60
lease_seconds = 300

[nodes.control]
role = "control"
capabilities = ["review"]
token_env = "RUNTIME_CONTROL_TOKEN"

[nodes.worker-a]
role = "worker"
capabilities = ["fixture-exec"]
token_env = "RUNTIME_WORKER_A_TOKEN"

[nodes.worker-b]
role = "worker"
capabilities = ["fixture-exec", "fixture-special"]
token_env = "RUNTIME_WORKER_B_TOKEN"

[repositories.fixture]
bare_path = "/root/workspace/runtime-v2-lab/fixture.git"
acceptance_profiles = ["counter-v1", "service-v1"]
acceptance_profile_configs.counter-v1 = { test_cmd = "python3 -m unittest -v test_counter", allowed_paths = ["counter.py", "test_counter.py"] }
acceptance_profile_configs.service-v1 = { test_cmd = "cargo fmt --check && cargo clippy -- -D warnings && cargo test", allowed_paths = ["scripts/**", "crates/service/**", "crates/runtime/src/main.rs"] }

[repositories.lab]
bare_path = "/root/workspace/runtime-v2-lab/lab.git"
acceptance_profiles = ["service-v1"]
acceptance_profile_configs.service-v1 = { test_cmd = "cargo fmt --check && cargo test --workspace", allowed_paths = ["scripts/**", "crates/**", "configs/**", "docs/**"] }